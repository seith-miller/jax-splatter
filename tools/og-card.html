<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  .card{
    position:relative;width:1200px;height:630px;overflow:hidden;
    background:
      radial-gradient(60% 55% at 78% 12%, rgba(70,179,255,0.28), transparent 60%),
      radial-gradient(55% 50% at 10% 96%, rgba(255,45,85,0.20), transparent 60%),
      linear-gradient(180deg,#06080e 0%,#05060a 60%,#04050a 100%);
    display:flex;flex-direction:column;justify-content:center;
    padding:0 84px;box-sizing:border-box;
  }
  .card::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);}
  .kicker{font-family:Oswald,sans-serif;font-weight:600;font-size:30px;letter-spacing:.30em;
    color:#46b3ff;margin:0 0 18px;text-transform:uppercase}
  .mark{font-family:Oswald,sans-serif;font-weight:700;font-size:158px;line-height:.95;
    letter-spacing:.03em;color:#e8ecf6;margin:0;text-transform:uppercase;
    text-shadow:0 0 60px rgba(70,179,255,.30)}
  .sub{font-family:Oswald,sans-serif;font-weight:500;font-size:29px;letter-spacing:.22em;
    color:#9aa3b8;margin:26px 0 0;text-transform:uppercase}
  .rule{width:132px;height:2px;background:#46b3ff;box-shadow:0 0 12px rgba(70,179,255,.6);margin-top:30px}
</style></head><body>
<div class="card">
  <p class="kicker">Music producer &amp; live performer</p>
  <h1 class="mark">DJ Seith</h1>
  <p class="sub">Sets · Shows · Every place to follow</p>
  <div class="rule"></div>
</div></body></html>
