<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  .card{
    position:relative;width:1200px;height:630px;overflow:hidden;
    background:
      radial-gradient(60% 55% at 78% 12%, rgba(70,179,255,0.28), transparent 60%),
      radial-gradient(55% 50% at 10% 96%, rgba(234,62,134,0.16), transparent 60%),
      linear-gradient(180deg,#06080e 0%,#05060a 60%,#04050a 100%);
    display:flex;flex-direction:column;justify-content:center;
    padding:0 84px;box-sizing:border-box;
  }
  .card::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);}
  .kicker{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.30em;
    color:#46b3ff;margin:0 0 14px}
  .mark{font-family:'Pathway Gothic One',sans-serif;font-weight:400;font-size:168px;line-height:.95;
    letter-spacing:.015em;color:#f2efe9;margin:0;white-space:nowrap;
    text-shadow:0 0 60px rgba(70,179,255,.30)}
  .mark .x{color:#ea3e86}
  .mark .gap{display:inline-block;width:.3em}
  .sub{font-family:'Bebas Neue',sans-serif;font-size:31px;letter-spacing:.22em;
    color:#9aa3b8;margin:26px 0 0}
  .rule{width:132px;height:2px;background:#ea3e86;box-shadow:0 0 12px rgba(234,62,134,.6);margin-top:30px}
</style></head><body>
<div class="card">
  <h1 class="mark">JA<span class="x">X</span><span class="gap"></span>SPLATTER</h1>
  <p class="sub">SETS · SHOWS · EVERY PLACE TO FOLLOW</p>
  <div class="rule"></div>
</div></body></html>
