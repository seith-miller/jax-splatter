<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:transparent}
.on-night{width:2400px;height:800px;background:#05060a;display:flex;align-items:center;justify-content:center}
.lockup{font-family:'Pathway Gothic One';font-weight:400;font-size:280px;color:#e8ecf6;white-space:nowrap;letter-spacing:.015em;margin:0;line-height:1}
.lockup .x{color:#ea3e86}
.lockup .gap{display:inline-block;width:.30em}
.avatar{width:1024px;height:1024px;background:#05060a;display:flex;align-items:center;justify-content:center}
.avatar p{font-family:'Pathway Gothic One';font-weight:400;font-size:560px;color:#e8ecf6;margin:0;letter-spacing:.015em;line-height:1}
.avatar .x{color:#ea3e86}
.bare{display:inline-block;padding:20px}
</style></head><body>
<div class="on-night" id="night"><p class="lockup">JA<span class="x">X</span><span class="gap"></span>SPLATTER</p></div>
<div class="avatar" id="avatar"><p>JA<span class="x">X</span></p></div>
<div class="bare" id="bare"><p class="lockup">JA<span class="x">X</span><span class="gap"></span>SPLATTER</p></div>
</body></html>
