<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:transparent}
/* Avatar variant of JAX-A005: same splat composition, JAX-alone mark per the
   A002 square-context rule. Sized so the splat mass and the mark survive
   Instagram's circular crop (content stays inside the inscribed circle). */
.avatar{position:relative;width:2048px;height:2048px;background:#05060a;overflow:hidden}
.splat{position:absolute}
.mark{position:absolute;left:0;right:0;text-align:center;
  font-family:'Pathway Gothic One';font-weight:400;color:#f2efe9;margin:0;line-height:1;letter-spacing:.015em;white-space:nowrap;
  text-shadow:0 0 12px #05060a, 0 0 28px #05060a, 0 0 52px #05060a, 0 7px 18px #05060a, 0 12px 40px #05060a}
.x{color:#ea3e86}
</style></head><body>
<div class="avatar" id="avatar">
  <img class="splat" src="splat-3.png" style="left:380px;top:480px;width:1300px;transform:rotate(9deg)">
  <img class="splat" src="splat-3.png" style="left:260px;top:420px;width:1560px;height:1200px;transform:rotate(-152deg);opacity:.98">
  <p class="mark" style="top:724px;font-size:600px">JA<span class="x">X</span></p>
</div>
</body></html>
