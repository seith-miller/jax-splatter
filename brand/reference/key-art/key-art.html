<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:transparent}
.wide{position:relative;width:1920px;height:1080px;background:#05060a;overflow:hidden}
.square{position:relative;width:2048px;height:2048px;background:#05060a;overflow:hidden}
.splat{position:absolute}
.mark{position:absolute;left:0;right:0;text-align:center;
  font-family:'Pathway Gothic One';font-weight:400;color:#f2efe9;margin:0;line-height:1;letter-spacing:.015em;white-space:nowrap;
  text-shadow:0 0 12px #05060a, 0 0 28px #05060a, 0 0 52px #05060a, 0 7px 18px #05060a, 0 12px 40px #05060a}
.x{color:#ea3e86}
.gap{display:inline-block;width:.30em}
</style></head><body>
<div class="wide" id="wide">
  <img class="splat" src="splat-3.png" style="left:230px;top:100px;width:880px;transform:rotate(12deg)">
  <img class="splat" src="splat-3.png" style="left:490px;top:78px;width:1300px;height:942px;transform:rotate(-152deg);opacity:.98">
  <p class="mark" style="top:435px;font-size:210px">JA<span class="x">X</span><span class="gap"></span>SPLATTER</p>
</div>
<div class="square" id="square">
  <img class="splat" src="splat-3.png" style="left:220px;top:390px;width:1280px;transform:rotate(9deg)">
  <img class="splat" src="splat-3.png" style="left:155px;top:340px;width:1830px;height:1400px;transform:rotate(-152deg);opacity:.98">
  <p class="mark" style="top:904px;font-size:240px">JA<span class="x">X</span><span class="gap"></span>SPLATTER</p>
</div>
</body></html>
