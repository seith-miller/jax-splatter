<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:transparent}
.wide{position:relative;width:1920px;height:1080px;background:#05060a;overflow:hidden}
.square{position:relative;width:2048px;height:2048px;background:#05060a;overflow:hidden}
.splat{position:absolute}
.mark{position:absolute;left:0;right:0;text-align:center;
  font-family:'Pathway Gothic One';font-weight:400;color:#f2efe9;margin:0;line-height:1;letter-spacing:.015em;white-space:nowrap;
  text-shadow:0 0 12px #05060a, 0 0 28px #05060a, 0 0 52px #05060a, 0 7px 18px #05060a, 0 12px 40px #05060a}
.x{color:#ea3e86}
.gap{display:inline-block;width:.30em}
</style></head><body>
<div class="wide" id="wide">
  <img class="splat" src="splat-3.png" style="left:180px;top:120px;width:1100px;transform:rotate(9deg)">
  <img class="splat" src="splat-3.png" style="left:700px;top:60px;width:1050px;transform:rotate(-152deg);opacity:.98">
  <img class="splat" src="splat-2.png" style="left:-260px;top:-260px;width:900px;transform:rotate(24deg);opacity:.9">
  <img class="splat" src="splat-1.png" style="left:1280px;top:520px;width:820px;transform:rotate(18deg);opacity:.95">
  <p class="mark" style="top:435px;font-size:210px">JA<span class="x">X</span><span class="gap"></span>SPLATTER</p>
</div>
<div class="square" id="square">
  <img class="splat" src="splat-3.png" style="left:120px;top:520px;width:1500px;transform:rotate(9deg)">
  <img class="splat" src="splat-3.png" style="left:600px;top:420px;width:1450px;transform:rotate(-152deg);opacity:.98">
  <img class="splat" src="splat-2.png" style="left:-350px;top:-330px;width:1250px;transform:rotate(24deg);opacity:.9">
  <img class="splat" src="splat-4.png" style="left:1150px;top:1350px;width:1200px;transform:rotate(-12deg);opacity:.95">
  <p class="mark" style="top:920px;font-size:240px">JA<span class="x">X</span><span class="gap"></span>SPLATTER</p>
</div>
</body></html>
