<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pathway+Gothic+One&family=Bebas+Neue&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
/* Jax-branded promo card in the Death to Summer colorway.
   DTS palette (interzone flyer): BONE #DFD9CE, INK #0E0C0F, RED #B01C1E.
   Jax rules: A002 wordmark with top billing (light-ground form: Night letters,
   X stays Splatter Pink), A003 type (Bebas display). Skull girl from the
   interzone flyer build (gather:interzone/skull-girl.png). 1080x1350. */
html,body{margin:0;padding:0;background:transparent}
.card{position:relative;width:1080px;height:1350px;background:#0e0c0f;overflow:hidden;font-family:'Bebas Neue';color:#dfd9ce}
.bone{position:absolute;left:0;top:0;width:1080px;height:540px;background:#dfd9ce}
.mark{position:absolute;left:64px;top:52px;margin:0;font-family:'Pathway Gothic One';font-size:150px;line-height:1;
  letter-spacing:.015em;color:#05060a;white-space:nowrap}
.x{color:#ea3e86}.gap{display:inline-block;width:.30em}
.girl{position:absolute;left:600px;bottom:-40px;height:1240px}
.col{position:absolute;left:64px;top:585px;width:560px}
.hero{font-size:172px;line-height:.86;letter-spacing:.01em;color:#dfd9ce}
.hero .red{color:#b01c1e}
.tonight{font-size:118px;line-height:1;margin-top:36px;color:#b01c1e;letter-spacing:.04em}
.when{font-size:78px;line-height:1;margin-top:22px;letter-spacing:.05em}
.where{font-family:'Inter';font-weight:600;font-size:31px;letter-spacing:.1em;margin-top:30px;text-transform:uppercase}
</style></head><body>
<div class="card" id="card">
  <div class="bone"></div>
  <img class="girl" src="skull-girl.png">
  <p class="mark">JA<span class="x">X</span><span class="gap"></span>SPLATTER</p>
  <div class="col">
    <div class="hero"><span class="red">DEATH</span> TO<br>SUMMER</div>
    <div class="tonight">TONIGHT</div>
    <div class="when">8—10 PM ET</div>
    <div class="where">twitch.tv/interzone_live</div>
  </div>
</div>
</body></html>
