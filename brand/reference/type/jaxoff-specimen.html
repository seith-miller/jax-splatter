<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Jax-Off';src:url('JaxOff-Regular.ttf') format('truetype')}
html,body{margin:0;padding:0}
.card{width:1200px;height:900px;background:#0a0b0f;box-sizing:border-box;padding:70px 80px;font-family:'Jax-Off'}
p{margin:0;color:#ea3e86}
.big{font-size:110px;line-height:1.25}
.mid{font-size:42px;line-height:1.4;color:#d1cac2;margin-top:30px}
.sm{font-size:42px;line-height:1.4;color:#39ff14;margin-top:10px}
</style></head><body>
<div class="card">
  <p class="big">JAX SPLATTER</p>
  <p class="mid">ABCDEFGHIJKLMNOPQRSTUVWXYZ</p>
  <p class="sm">0123456789 · PUT IT IN MY</p>
</div></body></html>
