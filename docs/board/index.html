<title>Splatter Ops</title>
<style id="css">
:root{
  --bg:#05060a; --text:#d2cab6; --muted:#7d8496; --mark:#ea3e86; --edge:#1c2030;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2efe9; --text:#05060a; --muted:#5b6172; --mark:#c22c6d; --edge:#d8d3c8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding-left:16px; padding-right:16px; padding-block:48px;
}
.card{text-align:center; max-width:640px; width:100%}
.kicker{
  font-family:'Bebas Neue',Impact,sans-serif; letter-spacing:.22em; font-size:13px;
  text-transform:uppercase; color:var(--muted);
}
.event{
  font-family:'Pathway Gothic One',Oswald,sans-serif; text-transform:uppercase;
  font-size:clamp(34px,9vw,64px); line-height:1; letter-spacing:.02em;
  margin:18px 0 0; color:var(--mark);
}
.date{
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:clamp(54px,16vw,128px); line-height:.9; margin:14px 0 0;
  font-variant-numeric:tabular-nums;
}
.days{
  margin-top:22px; padding-top:20px; border-top:1px solid var(--edge);
  font-size:15px; color:var(--muted);
}
.days b{color:var(--text); font-variant-numeric:tabular-nums}
.venue{margin-top:8px; font-size:15px; color:var(--muted)}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pathway+Gothic+One&family=Inter:wght@400;500&display=swap">

<div class="card">
  <span class="kicker">Next show</span>
  <h1 class="event">Dildozer</h1>
  <p class="date">Sat · Oct 24</p>
  <p class="days"><b id="days">—</b> days out</p>
  <p class="venue">Venue TBD</p>
</div>

<script id="js">
(function () {
  var p = [2026, 10, 24], n = new Date();
  var a = Date.UTC(p[0], p[1] - 1, p[2]);
  var b = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  var d = Math.round((a - b) / 86400000);
  document.getElementById('days').textContent = d > 0 ? d : (d === 0 ? 'Today —' : 'Past —');
})();
</script>
